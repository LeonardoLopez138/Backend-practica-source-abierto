spring.application.name=com-acme-nubi-platform
server.port=8080

# MySQL (put your own password in the empty field)
spring.datasource.url=jdbc:mysql://localhost:3306/nubi_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
